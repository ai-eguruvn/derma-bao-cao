<meta charset="utf-8">

<style>

  *{box-sizing:border-box}

  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}

  .ctl{display:flex;gap:8px;align-items:center}
  select,button{font:inherit;border:1px solid #c9cccf;border-radius:8px;background:#fff;padding:6px 10px;cursor:pointer}
  .seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
  .seg button.on{background:#303030;color:#fff;border-color:#303030}
  .guide{background:#eaf4ff;border:1px solid #b6d4fe;border-radius:12px;padding:12px 16px;margin-bottom:16px}
  .guide b{display:block;margin-bottom:4px}
  .guide ol{margin:4px 0 0;padding-left:20px}
  section{background:var(--card);border-radius:12px;box-shadow:0 1px 0 rgba(0,0,0,.07);padding:16px;margin-bottom:16px}
  .sec-h{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline}
  h2{font-size:16px;margin:0}
  .num{font-size:12px;color:#fff;background:#303030;border-radius:999px;padding:1px 8px;margin-right:6px}
  a.src{font-size:13px;color:var(--accent);text-decoration:none}
  a.src:hover{text-decoration:underline}
  details{margin:8px 0 12px;background:var(--soft);border-radius:8px;padding:8px 12px}
  summary{cursor:pointer;font-weight:600}
  details ul{margin:6px 0 0;padding-left:18px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
  .kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .kpi .l{color:var(--mute);font-size:12px}
  .kpi .v{font-size:20px;font-weight:650;margin-top:2px}
  .kpi .d{font-size:12px;margin-top:2px}
  .up{color:var(--good)}.down{color:var(--bad)}

  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--mute);font-weight:600;background:var(--soft)}
  tr.tot td{font-weight:700;border-top:2px solid #c9cccf}

let L = "vi";
const $ = s => document.querySelector(s);
const fmt = n => (n == null || isNaN(n)) ? "—" : new Intl.NumberFormat("vi-VN").format(Math.round(n));
const vnd = n => (n == null || isNaN(n)) ? "—" : fmt(n) + " ₫";
const pct = n => (n == null || isNaN(n) || !isFinite(n)) ? "—" : (n * 100).toFixed(n > 0 && n < 0.001 ? 4 : 2).replace(".", L === "vi" ? "," : ".") + "%";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());

function months() {
  const now = new Date(), out = [];
  for (let i = 0; i < 6; i++) {
    const s = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const e = i === 0 ? now : new Date(s.getFullYear(), s.getMonth() + 1, 0);
    out.push({ s: iso(s), e: iso(e), m: s.getMonth() + 1, y: s.getFullYear(), cur: i === 0 });
  }
  return out;
}
const MONTHS = months();

function applyText() {
  document.documentElement.lang = L;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T[L][el.dataset.t]; });
  $("#vi").classList.toggle("on", L === "vi"); $("#en").classList.toggle("on", L === "en");
  const sel = $("#month"), keep = sel.value;
  sel.innerHTML = MONTHS.map((m, i) => `<option value="${i}">${L === "vi" ? "Tháng " + m.m + "/" + m.y : new Date(m.y, m.m - 1, 1).toLocaleString("en", { month: "long", year: "numeric" })}${m.cur ? T[L].toDate : ""}</option>`).join("");
  sel.value = keep || "1";
}

async function ql(query) {
  const res = await fetch("shopify:admin/api/2026-01/graphql.json", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query: "query($q:String!){ shopifyqlQuery(query:$q){ parseErrors tableData{ columns{ name dataType } rows } } }", variables: { q: query } })
  });
  const j = await res.json();
  if (j.errors) throw new Error(j.errors.map(e => e.message).join("; "));
  const r = j.data.shopifyqlQuery;
  if (r.parseErrors && r.parseErrors.length) throw new Error(JSON.stringify(r.parseErrors));
  const cols = r.tableData.columns.map(c => c.name);
  let rows = r.tableData.rows;
  if (typeof rows === "string") rows = JSON.parse(rows);
  return rows.map(row => Array.isArray(row) ? Object.fromEntries(cols.map((c, i) => [c, row[i]])) : row);
}
const num = v => v == null || v === "" ? null : Number(v);
const adminLink = (report, q) => "shopify://admin/analytics/reports/" + report + "?ql=" + encodeURIComponent(q);

const qSales = (m) => `FROM sales
  SHOW orders, gross_sales, discounts, returns, net_sales, average_order_value
  GROUP BY sales_channel WITH TOTALS
  SINCE ${m.s} UNTIL ${m.e}
  ORDER BY net_sales DESC`;
const qSrc = (m) => `FROM sessions
  SHOW sessions, sessions_with_cart_additions, sessions_that_reached_checkout
  GROUP BY referrer_source, referrer_name WITH TOTALS
  SINCE ${m.s} UNTIL ${m.e}
  ORDER BY sessions DESC
  LIMIT 1000`;
const qOrdSrc = (m) => `FROM sales
  SHOW orders, net_sales
  GROUP BY order_referrer_source, order_referrer_name WITH TOTALS
  SINCE ${m.s} UNTIL ${m.e}
  ORDER BY net_sales DESC
  LIMIT 1000`;

// API trả tổng ở các cột "<tên>__totals" trên mỗi dòng
function totals(rows, cols) {
  const r0 = rows[0] || {}, o = {};
  cols.forEach(c => o[c] = r0[c + "__totals"]);
  return o;
}
function delta(cur, prev) {
  if (!prev) return "";
  const d = (cur - prev) / prev, cls = d >= 0 ? "up" : "down";
  return `<span class="${cls}">${d >= 0 ? "▲" : "▼"} ${pct(Math.abs(d))}</span> ${T[L].vsPrev}`;
}

async function loadS1(m, prev) {
  const [rows, prow] = await Promise.all([ql(qSales(m)), ql(qSales(prev))]);
  const C = ["orders", "gross_sales", "discounts", "returns", "net_sales", "average_order_value"];
  const tot = totals(rows, C), ptot = totals(prow, C);
  const body = rows;
  const web = body.find(r => r.sales_channel === "Online Store") || {};
  const pweb = prow.find(r => r.sales_channel === "Online Store") || {};
  $("#s1k").innerHTML = [
    [T[L].k_net, vnd(num(tot.net_sales)), delta(num(tot.net_sales), num(ptot.net_sales))],
    [T[L].k_ord, fmt(num(tot.orders)), delta(num(tot.orders), num(ptot.orders))],
    [T[L].k_aov, vnd(num(tot.average_order_value)), delta(num(tot.average_order_value), num(ptot.average_order_value))],
    [T[L].k_web, vnd(num(web.net_sales)), delta(num(web.net_sales), num(pweb.net_sales))]
  ].map(([l, v, d]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join("");
  const tr = (r, cls = "") => `<tr class="${cls}"><td>${esc(r.sales_channel || T[L].total)}</td><td>${fmt(num(r.orders))}</td><td>${vnd(num(r.gross_sales))}</td><td>${vnd(num(r.discounts))}</td><td>${vnd(num(r.returns))}</td><td><b>${vnd(num(r.net_sales))}</b></td><td>${vnd(num(r.average_order_value))}</td></tr>`;
  $("#s1t").innerHTML = `<table><thead><tr><th>${T[L].c_channel}</th><th>${T[L].c_orders}</th><th>${T[L].c_gross}</th><th>${T[L].c_disc}</th><th>${T[L].c_ret}</th><th>${T[L].c_net}</th><th>${T[L].c_aov}</th></tr></thead><tbody>${body.map(r => tr(r)).join("")}${tr(tot, "tot")}</tbody></table>`;
  $("#s1src").href = adminLink("net_sales_over_time", qSales(m));
}

const NAMES = { facebook: "Facebook", instagram: "Instagram", google: "Google", bing: "Bing", coccoc: "Cốc Cốc", tiktok: "TikTok", zalo: "Zalo", youtube: "YouTube", chatgpt: "ChatGPT" };
// Khoá ghép 2 nguồn: tên nguồn viết thường; vào thẳng + không ghi nguồn gộp chung (bên đơn hàng không tách được)
function srcKey(source, name) {
  if (!source || source === "direct") return "_none";
  return (name || source).toLowerCase();
}
function keyName(k) { return k === "_none" ? T[L].nosrc : (NAMES[k] || k); }

async function loadS2(m) {
  const C = ["sessions", "sessions_with_cart_additions", "sessions_that_reached_checkout"];
  const [srows, orows] = await Promise.all([ql(qSrc(m)), ql(qOrdSrc(m))]);
  const stot = totals(srows, C), otot = totals(orows, ["orders", "net_sales"]);
  const map = new Map();
  const get = k => map.get(k) || (map.set(k, { k, sessions: 0, sessions_with_cart_additions: 0, sessions_that_reached_checkout: 0, orders: 0, net_sales: 0 }), map.get(k));
  srows.forEach(r => { const g = get(srcKey(r.referrer_source, r.referrer_name)); C.forEach(c => g[c] += num(r[c]) || 0); });
  orows.forEach(r => { const g = get(srcKey(r.order_referrer_source, r.order_referrer_name)); g.orders += num(r.orders) || 0; g.net_sales += num(r.net_sales) || 0; });
  const all = [...map.values()].sort((a, b) => b.sessions - a.sessions);
  const keep = all.filter((r, i) => i < 5 || r.orders > 0);
  const rest = all.filter(r => !keep.includes(r));
  const sum = c => rest.reduce((a, r) => a + r[c], 0);
  const restRow = rest.length ? { _name: T[L].others + " (" + rest.length + ")", sessions: sum("sessions"), sessions_with_cart_additions: sum("sessions_with_cart_additions"), sessions_that_reached_checkout: sum("sessions_that_reached_checkout"), orders: sum("orders"), net_sales: sum("net_sales") } : null;
  const tr = (r, cls = "") => `<tr class="${cls}"><td>${esc(r._name || keyName(r.k))}</td><td>${fmt(num(r.sessions))}</td><td>${fmt(num(r.sessions_with_cart_additions))}</td><td>${fmt(num(r.sessions_that_reached_checkout))}</td><td><b>${fmt(num(r.orders))}</b></td><td><b>${vnd(num(r.net_sales))}</b></td></tr>`;
  const tot = Object.assign({ _name: T[L].total }, stot, otot);
  $("#s2t").innerHTML = `<table><thead><tr><th>${T[L].m_channel}</th><th>${T[L].m_sessions}</th><th>${T[L].m_cart}</th><th>${T[L].m_chk}</th><th>${T[L].m_ord}</th><th>${T[L].m_net}</th></tr></thead><tbody>${keep.map(r => tr(r)).join("")}${restRow ? tr(restRow) : ""}${tr(tot, "tot")}</tbody></table>`;
  const need = all.filter(r => r.k !== "_none" && r.orders > 0).map(r => ({ label: keyName(r.k), value: r.sessions / r.orders, text: fmt(r.sessions / r.orders) + " " + T[L].t_need, tip: `${T[L].m_sessions}: ${fmt(r.sessions)}<br>${T[L].m_ord}: ${fmt(r.orders)}<br>${fmt(r.sessions / r.orders)} ${T[L].t_need}` })).sort((a, b) => b.value - a.value);
  hBars($("#s2c"), need, "var(--s2)");
  $("#s2src").href = adminLink("sessions_over_time", qSrc(m));
}

// ---- Biểu đồ SVG tự vẽ (không thư viện) ----
const SVGNS = "http://www.w3.org/2000/svg";
function tipFor(el) { let t = el.querySelector(".tip"); if (!t) { t = document.createElement("div"); t.className = "tip"; el.appendChild(t); } return t; }
function bindTip(el, node, html) {
  const tip = tipFor(el);
  node.addEventListener("mousemove", e => { const r = el.getBoundingClientRect(); tip.innerHTML = html; tip.style.display = "block"; tip.style.left = Math.min(e.clientX - r.left + 12, r.width - tip.offsetWidth - 4) + "px"; tip.style.top = (e.clientY - r.top - tip.offsetHeight - 10) + "px"; });
  node.addEventListener("mouseleave", () => tip.style.display = "none");
}
const topRound = (x, y, w, h, r) => h <= 0 ? "" : `M${x},${y + h}V${y + Math.min(r, h)}Q${x},${y} ${x + Math.min(r, w / 2)},${y}H${x + w - Math.min(r, w / 2)}Q${x + w},${y} ${x + w},${y + Math.min(r, h)}V${y + h}Z`;

function stackedBars(el, cats, series, selIdx) {
  const W = 760, H = 250, L0 = 44, B = 26, TP = 22, R = 8;
  const sums = cats.map((_, i) => series.reduce((a, s) => a + (s.values[i] || 0), 0));
  const max = Math.max(...sums, 1) * 1.15, iw = W - L0 - R, ih = H - TP - B, band = iw / cats.length, bw = Math.min(56, band * 0.55);
  const y = v => TP + ih - v / max * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (let k = 0; k <= 4; k++) { const v = max / 4 * k, yy = y(v); s += `<line x1="${L0}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/><text x="${L0 - 6}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--axis)">${fmt(v / 1e6)}</text>`; }
  cats.forEach((c, i) => {
    const x = L0 + band * i + (band - bw) / 2; let base = 0, segs = "";
    series.forEach((ser, j) => {
      const v = ser.values[i] || 0; if (!v) return;
      const y0 = y(base), y1 = y(base + v), gap = base > 0 ? 2 : 0, h = Math.max(0, y0 - y1 - gap);
      const isTop = series.slice(j + 1).every(z => !(z.values[i] > 0));
      segs += isTop ? `<path d="${topRound(x, y1, bw, h, 4)}" fill="${ser.color}"/>` : `<rect x="${x}" y="${y1}" width="${bw}" height="${h}" fill="${ser.color}"/>`;
      base += v;
    });
    s += `<g opacity="${selIdx == null || selIdx === i ? 1 : 0.45}">${segs}</g>`;
    s += `<text x="${x + bw / 2}" y="${y(sums[i]) - 6}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${fmt(sums[i] / 1e6)}</text>`;
    s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--axis)" ${selIdx === i ? 'font-weight="700"' : ""}>${esc(c)}</text>`;
    s += `<rect class="hit" data-i="${i}" x="${L0 + band * i}" y="${TP}" width="${band}" height="${ih}" fill="transparent"/>`;
  });
  s += `<line x1="${L0}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="#c3c2b7"/></svg>`;
  el.innerHTML = s;
  el.querySelectorAll(".hit").forEach(h => { const i = +h.dataset.i; bindTip(el, h, `<b>${esc(cats[i])}</b><br>${series.map(z => `<span style="color:${z.color}">■</span> ${esc(z.name)}: ${vnd(z.values[i] || 0)}`).join("<br>")}<br>${T[L].total}: <b>${vnd(sums[i])}</b>`); });
}

function hBars(el, items, color) {
  if (!items.length) { el.innerHTML = ""; return; }
  const W = 760, LW = 250, R = 170, rowH = 30, H = items.length * rowH + 6;
  const max = Math.max(...items.map(i => i.value), 1), iw = W - LW - R;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  items.forEach((it, i) => {
    const yy = 4 + i * rowH, w = Math.max(2, it.value / max * iw);
    const lab = it.label.length > 38 ? it.label.slice(0, 36) + "…" : it.label;
    s += `<text x="${LW - 8}" y="${yy + 17}" text-anchor="end" font-size="12" fill="var(--ink)">${esc(lab)}</text>`;
    s += `<path d="M${LW},${yy + 5}H${LW + w - 4}Q${LW + w},${yy + 5} ${LW + w},${yy + 9}V${yy + 19}Q${LW + w},${yy + 23} ${LW + w - 4},${yy + 23}H${LW}Z" fill="${color}"/>`;
    s += `<text x="${LW + w + 6}" y="${yy + 18}" font-size="12" fill="var(--mute)">${esc(it.text)}</text>`;
    s += `<rect class="hit" data-i="${i}" x="0" y="${yy}" width="${W}" height="${rowH}" fill="transparent"/>`;
  });
  el.innerHTML = s + "</svg>";
  el.querySelectorAll(".hit").forEach(h => { const it = items[+h.dataset.i]; bindTip(el, h, `<b>${esc(it.label)}</b><br>${it.tip || esc(it.text)}`); });
}

const qTrend = (s, e) => `FROM sales
  SHOW net_sales
  GROUP BY sales_channel TIMESERIES month
  SINCE ${s} UNTIL ${e}`;
async function loadS1Chart(m) {
  const s = iso(new Date(m.y, m.m - 6, 1));
  const rows = await ql(qTrend(s, m.e));
  const months = [...new Set(rows.map(r => r.month))].sort();
  const lab = d => { const [y, mo] = d.split("-"); return L === "vi" ? "T" + (+mo) + "/" + y.slice(2) : new Date(+y, +mo - 1, 1).toLocaleString("en", { month: "short" }) + " " + y.slice(2); };
  const val = (ch, mo) => num((rows.find(r => r.month === mo && r.sales_channel === ch) || {}).net_sales) || 0;
  stackedBars($("#s1c"), months.map(lab), [
    { name: "Online Store", color: "var(--s1)", values: months.map(mo => val("Online Store", mo)) },
    { name: "Draft Orders", color: "var(--s2)", values: months.map(mo => val("Draft Orders", mo)) }
  ], months.length - 1);
}

const qCamp = (m) => `FROM sessions
  SHOW sessions, sessions_with_cart_additions, sessions_that_reached_checkout
  GROUP BY utm_source, utm_medium, utm_campaign
  WHERE utm_campaign IS NOT NULL
  SINCE ${m.s} UNTIL ${m.e}
  ORDER BY sessions DESC
  LIMIT 1000`;
async function loadS3(m) {
  const rows = await ql(qCamp(m));
  const top = rows.slice(0, 10);
  hBars($("#s3c"), top.map(r => ({ label: r.utm_campaign, value: num(r.sessions) || 0, text: fmt(num(r.sessions)), tip: `${esc(r.utm_source || "")} / ${esc(r.utm_medium || "")}<br>${T[L].m_sessions}: ${fmt(num(r.sessions))}<br>${T[L].m_cart}: ${fmt(num(r.sessions_with_cart_additions))}<br>${T[L].m_chk}: ${fmt(num(r.sessions_that_reached_checkout))}` })), "var(--s1)");
  const tr = r => { const s = num(r.sessions), c = num(r.sessions_with_cart_additions); return `<tr><td>${esc(r.utm_campaign)}</td><td>${esc(r.utm_source || "—")}</td><td>${esc(r.utm_medium || "—")}</td><td>${fmt(s)}</td><td>${fmt(c)}</td><td>${fmt(num(r.sessions_that_reached_checkout))}</td><td>${s ? pct(c / s) : "—"}</td></tr>`; };
  $("#s3t").innerHTML = rows.length ? `<table><thead><tr><th>${T[L].t_camp}</th><th>${T[L].t_src}</th><th>${T[L].t_med}</th><th>${T[L].m_sessions}</th><th>${T[L].m_cart}</th><th>${T[L].m_chk}</th><th>${T[L].t_rate}</th></tr></thead><tbody>${top.map(tr).join("")}</tbody></table>${rows.length > 10 ? `<p class="note">+ ${rows.length - 10} ${T[L].others.toLowerCase()}</p>` : ""}` : `<p class="muted">—</p>`;
  $("#s3src").href = adminLink("sessions_over_time", qCamp(m));
}

async function load() {
  const i = +$("#month").value, m = MONTHS[i];
  const prev = MONTHS[i + 1] || (() => { const s = new Date(m.y, m.m - 2, 1); return { s: iso(s), e: iso(new Date(m.y, m.m - 1, 0)) }; })();
  ["#s1t", "#s2t", "#s3t"].forEach(s => $(s).innerHTML = `<p class="muted">${T[L].loading}</p>`);
  ["#s1k", "#s1c", "#s2c", "#s3c"].forEach(s => $(s).innerHTML = "");
  loadS1Chart(m).catch(e => $("#s1c").innerHTML = `<p class="err">${T[L].err}${esc(e.message)}</p>`);
  loadS3(m).catch(e => $("#s3t").innerHTML = `<p class="err">${T[L].err}${esc(e.message)}</p>`);
  loadS1(m, prev).catch(e => $("#s1t").innerHTML = `<p class="err">${T[L].err}${esc(e.message)}</p>`);
  loadS2(m).catch(e => $("#s2t").innerHTML = `<p class="err">${T[L].err}${esc(e.message)}</p>`);
}

$("#vi").onclick = () => { L = "vi"; applyText(); load(); };
$("#en").onclick = () => { L = "en"; applyText(); load(); };
$("#month").onchange = load;
applyText(); load();
</script>
